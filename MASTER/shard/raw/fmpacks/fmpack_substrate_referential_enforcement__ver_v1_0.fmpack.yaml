name: fmpack_substrate_referential_enforcement__ver_v1_0
description: |
  Formalizes the substrate's unique structural-referential-enforcement property.
  Mainstream software has symbolic references (link-time binding, version pinning,
  recompile to swap). Paradaxis has STRUCTURAL references (reference IS structure):
  - Anchors immutable forever (R66 pack-truth-supreme)
  - Filename grammar carries version inline (R20)
  - FMpack loads at runtime not link time (R24)
  - Cwd determines branch (chunk_76 sub_law_7)
  - Pack record IS the truth (R66)
  Result: ANY def from ANY version of ANY skill/code/rule pullable AT ANY TIME
  via 4 resolution modes (anchor / name / filename / version_ordinal / branch).
  No recompile. No link-time binding. No dep resolver. No version conflict.

tier: external

property_codified: structural_referential_enforcement

